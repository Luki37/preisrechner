<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preisrechner</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="calculator">
        <h1>Preisrechner</h1>
        <div class="tablet">
          <button onclick="add('Sago’t Gulaman', 7.0)" class="btn">
            <span class="product">Sago`t Gulaman</span
            ><span class="price">7.00 CHF</span></button
          ><button onclick="add('Buko Juice', 7.0)" class="btn">
            <span class="product">Buko Juice</span
            ><span class="price">7.00 CHF</span></button
          ><button onclick="add('Calamansi Juice', 6.5)" class="btn">
            <span class="product">Calamansi Juice</span
            ><span class="price">6.50 CHF</span></button
          ><button onclick="add('Kapeng Barako', 6.0)" class="btn">
            <span class="product">Kapeng Barako</span
            ><span class="price">6.00 CHF</span></button
          ><button onclick="add('Lumpia', 16.0)" class="btn">
            <span class="product">Lumpia</span
            ><span class="price">16.00 CHF</span></button
          ><button onclick="add('Tokwa’t Baboy', 20.0)" class="btn">
            <span class="product">Tokwa’t Baboy</span
            ><span class="price">20.00 CHF</span></button
          ><button onclick="add('Kinilaw', 22.0)" class="btn">
            <span class="product">Kinilaw</span
            ><span class="price">22.00 CHF</span></button
          ><button onclick="add('Ukoy', 18.0)" class="btn">
            <span class="product">Ukoy</span
            ><span class="price">18.00 CHF</span></button
          ><button onclick="add('Adobo', 24.0)" class="btn">
            <span class="product">Adobo</span
            ><span class="price">24.00 CHF</span></button
          ><button onclick="add('Sinigang', 28.0)" class="btn">
            <span class="product">Sinigang</span
            ><span class="price">28.00 CHF</span></button
          ><button onclick="add('Lechon', 32.0)" class="btn">
            <span class="product">Lechon</span
            ><span class="price">32.00 CHF</span></button
          ><button onclick="add('Kare-Kare', 30.0)" class="btn">
            <span class="product">Kare-Kare</span
            ><span class="price">30.00 CHF</span></button
          ><button onclick="add('Halo-Halo', 12.0)" class="btn">
            <span class="product">Halo-Halo</span
            ><span class="price">12.00 CHF</span></button
          ><button onclick="add('Leche Flan', 9.0)" class="btn">
            <span class="product">Leche Flan</span
            ><span class="price">9.00 CHF</span></button
          ><button onclick="add('Bibingka', 10.0)" class="btn">
            <span class="product">Bibingka</span
            ><span class="price">10.00 CHF</span></button
          ><button onclick="add('Ube Halaya', 9.0)" class="btn">
            <span class="product">Ube Halaya</span
            ><span class="price">9.00 CHF</span>
          </button>
        </div>
        <hr />
        <div class="overview">
          <div class="sum">
            <h3>Gesammt</h3>
            <span id="total">0.00 CHF</span>
          </div>

          <div class="control">
            <button class="control-btn" id="reset" onclick="reset()">
              Zurücksetzen</button
            ><button class="control-btn" id="local" onclick="local()">
              Vor Ort</button
            ><button class="control-btn" id="deliver" onclick="deliver()">
              Lieferung
            </button>
          </div>
        </div>
      </div>
      <div class="order">
        <h2>Bestellung</h2>
        <ul id="order-list"></ul>
      </div>
    </div>
  </body>
</html>
